<app-modal-shell
  eyebrow="INVITACIÓN MASIVA DE ACCESO"
  title="¿Enviar invitaciones pendientes?"
  roleType="alertdialog"
  (closeModal)="cancel.emit()"
>
  <div class="confirm-body">
    <div class="confirm-icon" aria-hidden="true">↗</div>
    <p class="confirm-text">
      Se enviará un correo de invitación a
      <strong>
        {{ pendingCount() }} {{ pendingCount() === 1 ? 'persona' : 'personas' }}
      </strong>
      que todavía no tienen una sesión activa en la plataforma.
    </p>
    <div class="confirm-actions">
      <button type="button" class="btn-secondary" (click)="cancel.emit()">Ahora no</button>
      <button
        type="button"
        class="btn-primary"
        [disabled]="saving()"
        (click)="confirmSend.emit()"
      >
        {{ saving() ? 'Enviando…' : 'Sí, enviar invitaciones' }}
      </button>
    </div>
  </div>
</app-modal-shell>
