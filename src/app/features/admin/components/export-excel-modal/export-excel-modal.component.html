<app-modal-shell
  eyebrow="EXPORTACIÓN DE VACACIONES"
  title="Exportar a Excel"
  subtitle="Descarga el listado de vacaciones de todos los usuarios en formato Excel."
  (closeModal)="cancel.emit()"
>
  <form class="export-form" (ngSubmit)="submitExport()">
    <label class="field">
      <span>Año</span>
      <select
        name="year"
        [ngModel]="selectedYear()"
        (ngModelChange)="onYearChange($event)"
        required
      >
        @for (year of yearOptions(); track year) {
          <option [ngValue]="year">{{ year }}</option>
        }
      </select>
    </label>

    <div class="months-grid-section">
      <span class="months-grid-label">Mes</span>
      <div class="months-grid" role="group" aria-label="Meses del año">
        @for (item of months; track item.value) {
          <button
            type="button"
            class="month-chip"
            [class.is-selected]="selectedMonth() === item.value"
            [class.is-previous-default]="
              item.value === defaultPeriod.month && selectedYear() === defaultPeriod.year
            "
            (click)="selectMonthChip(item.value)"
          >
            <span>{{ item.label }}</span>
            @if (item.value === defaultPeriod.month && selectedYear() === defaultPeriod.year) {
              <small class="chip-tag">Anterior</small>
            }
          </button>
        }
      </div>
    </div>

    <div class="export-summary">
      <span class="summary-icon" aria-hidden="true">📊</span>
      <p>
        Se consultarán las vacaciones de todos los usuarios para
        <strong>{{ selectedPeriodLabel() }}</strong> y se generará un archivo
        <code>.xlsx</code> con las columnas <strong>Nombre</strong>,
        <strong>Correo</strong> y <strong>Día de vacaciones</strong> (1 fila por día).
      </p>
    </div>

    <div class="form-actions">
      <button
        type="button"
        class="btn-secondary"
        [disabled]="exporting()"
        (click)="cancel.emit()"
      >
        Cancelar
      </button>
      <button type="submit" class="btn-primary" [disabled]="exporting()">
        {{ exporting() ? 'Generando…' : '⬇ Descargar Excel' }}
      </button>
    </div>
  </form>
</app-modal-shell>
