<app-modal-shell
  [eyebrow]="mode() === 'create' ? 'NUEVO MIEMBRO DEL EQUIPO' : 'EDICIÓN DE PERFIL'"
  [title]="mode() === 'create' ? 'Añadir persona' : 'Editar usuario'"
  [subtitle]="
    mode() === 'create'
      ? 'Completa los datos profesionales para darle de alta y enviarle una invitación.'
      : 'Actualiza la información corporativa de esta persona.'
  "
  (closeModal)="cancel.emit()"
>
  <form class="user-form" (ngSubmit)="submitForm()">
    <label class="field">
      <span>Nombre</span>
      <input
        name="nombre"
        [ngModel]="form().nombre"
        (ngModelChange)="updateField('nombre', $event)"
        placeholder="Ej. Laura"
        required
      />
    </label>

    <label class="field">
      <span>Apellidos</span>
      <input
        name="apellidos"
        [ngModel]="form().apellidos"
        (ngModelChange)="updateField('apellidos', $event)"
        placeholder="Ej. García Pérez"
        required
      />
    </label>

    <label class="field full-row">
      <span>Cargo / Rol</span>
      <input
        name="cargo"
        [ngModel]="form().cargo"
        (ngModelChange)="updateField('cargo', $event)"
        placeholder="Ej. Frontend Developer"
        required
      />
    </label>

    <label class="field full-row">
      <span>Correo electrónico corporativo</span>
      <input
        name="email"
        type="email"
        [ngModel]="form().email"
        (ngModelChange)="updateField('email', $event)"
        placeholder="nombre@empresa.com"
        required
      />
    </label>

    <label class="field full-row">
      <span>Convenio / Tipo de vacaciones</span>
      <input
        name="tipo_vacaciones"
        [ngModel]="form().tipo_vacaciones"
        (ngModelChange)="updateField('tipo_vacaciones', $event)"
        placeholder="Ej. 22 días laborables / Estándar"
        required
      />
    </label>

    <div class="form-actions full-row">
      <button type="button" class="btn-secondary" (click)="cancel.emit()">Cancelar</button>
      <button type="submit" class="btn-primary" [disabled]="saving()">
        {{
          saving()
            ? 'Guardando…'
            : mode() === 'create'
              ? 'Crear usuario'
              : 'Guardar cambios'
        }}
      </button>
    </div>
  </form>
</app-modal-shell>
